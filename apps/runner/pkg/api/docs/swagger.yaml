definitions:
  BuildSnapshotRequestDTO:
    properties:
      context:
        items:
          type: string
        type: array
      dockerfile:
        type: string
      organizationId:
        type: string
      pushToInternalRegistry:
        type: boolean
      registry:
        $ref: '#/definitions/RegistryDTO'
      snapshot:
        description: Snapshot ID and tag or the build's hash
        type: string
      sourceRegistries:
        items:
          $ref: '#/definitions/RegistryDTO'
        type: array
    required:
      - dockerfile
      - organizationId
    type: object
  CreateBackupDTO:
    properties:
      registry:
        $ref: '#/definitions/RegistryDTO'
      snapshot:
        type: string
    required:
      - registry
      - snapshot
    type: object
  CreateSandboxDTO:
    properties:
      authToken:
        type: string
      cpuQuota:
        minimum: 1
        type: integer
      domainAllowList:
        type: string
      entrypoint:
        items:
          type: string
        type: array
      env:
        additionalProperties:
          type: string
        type: object
      fromVolumeId:
        type: string
      gpuQuota:
        minimum: 0
        type: integer
      id:
        type: string
      linkedSandboxId:
        description: |-
          LinkedSandboxId identifies an existing sandbox this sandbox should be co-located with.
          When set, the runner should attach both sandboxes to a shared local network so they can communicate.
        type: string
      memoryQuota:
        minimum: 1
        type: integer
      metadata:
        additionalProperties:
          type: string
        type: object
      name:
        description: |-
          Name is the human-readable sandbox name. When present, it is used as the
          network alias for link networks so linked sandboxes can resolve each other
          by name.
        type: string
      networkAllowList:
        type: string
      networkBlockAll:
        type: boolean
      organizationId:
        description: Nullable for backward compatibility
        type: string
      osUser:
        type: string
      otelEndpoint:
        type: string
      regionId:
        type: string
      registry:
        $ref: '#/definitions/RegistryDTO'
      sandboxClass:
        description: Optional for backward compatibility, but when provided, indicates
          the class of sandbox to create.
        type: string
      secretsToken:
        description: |-
          SecretsToken is a runner-only token used solely to resolve plaintext
          secrets from the API (separate from AuthToken, which lives in the sandbox).
        type: string
      skipStart:
        type: boolean
      snapshot:
        type: string
      storageQuota:
        minimum: 1
        type: integer
      userId:
        type: string
      volumes:
        items:
          $ref: '#/definitions/dto.VolumeDTO'
        type: array
    required:
      - id
      - osUser
      - snapshot
      - userId
    type: object
  CreateSnapshotFromSandboxRequest:
    properties:
      name:
        example: my-snapshot:latest
        type: string
      organizationId:
        type: string
      registry:
        $ref: '#/definitions/RegistryDTO'
    required:
      - name
      - registry
    type: object
  ErrorResponse:
    description: Error response
    properties:
      code:
        example: BAD_REQUEST
        type: string
      message:
        example: Bad request
        type: string
      method:
        example: GET
        type: string
      path:
        example: /api/resource
        type: string
      statusCode:
        example: 400
        type: integer
      timestamp:
        example: '2023-01-01T12:00:00Z'
        type: string
    required:
      - message
      - path
      - statusCode
      - timestamp
    type: object
  InspectSnapshotInRegistryRequest:
    properties:
      registry:
        $ref: '#/definitions/RegistryDTO'
      snapshot:
        example: nginx:latest
        type: string
    required:
      - snapshot
    type: object
  IsRecoverableDTO:
    properties:
      errorReason:
        type: string
    required:
      - errorReason
    type: object
  IsRecoverableResponse:
    properties:
      recoverable:
        type: boolean
    type: object
  PullSnapshotRequestDTO:
    properties:
      destinationRef:
        type: string
      destinationRegistry:
        $ref: '#/definitions/RegistryDTO'
      diskGiB:
        type: integer
      newTag:
        type: string
      registry:
        $ref: '#/definitions/RegistryDTO'
      sandboxClass:
        type: string
      snapshot:
        type: string
    required:
      - snapshot
    type: object
  RecoverSandboxDTO:
    properties:
      backupErrorReason:
        type: string
      cpuQuota:
        minimum: 1
        type: integer
      domainAllowList:
        type: string
      env:
        additionalProperties:
          type: string
        type: object
      errorReason:
        description: At least one of ErrorReason or BackupErrorReason must yield a
          recovery type; both are optional.
        type: string
      fromVolumeId:
        type: string
      gpuQuota:
        minimum: 0
        type: integer
      memoryQuota:
        minimum: 1
        type: integer
      networkAllowList:
        type: string
      networkBlockAll:
        type: boolean
      osUser:
        type: string
      registry:
        $ref: '#/definitions/RegistryDTO'
      snapshot:
        type: string
      storageQuota:
        minimum: 1
        type: integer
      userId:
        type: string
      volumes:
        items:
          $ref: '#/definitions/dto.VolumeDTO'
        type: array
    required:
      - osUser
      - userId
    type: object
  RegistryDTO:
    properties:
      password:
        type: string
      project:
        type: string
      url:
        type: string
      username:
        type: string
    required:
      - url
    type: object
  ResizeSandboxDTO:
    properties:
      cpu:
        minimum: 1
        type: integer
      disk:
        minimum: 1
        type: integer
      gpu:
        minimum: 0
        type: integer
      memory:
        minimum: 1
        type: integer
      registry:
        $ref: '#/definitions/RegistryDTO'
    type: object
  RunnerInfoResponseDTO:
    properties:
      appVersion:
        type: string
      metrics:
        $ref: '#/definitions/RunnerMetrics'
      serviceHealth:
        items:
          $ref: '#/definitions/RunnerServiceInfo'
        type: array
    type: object
  RunnerMetrics:
    properties:
      currentAllocatedCpu:
        type: number
      currentAllocatedDiskGiB:
        type: number
      currentAllocatedMemoryGiB:
        type: number
      currentCpuLoadAverage:
        type: number
      currentCpuUsagePercentage:
        type: number
      currentDiskUsagePercentage:
        type: number
      currentMemoryUsagePercentage:
        type: number
      currentSnapshotCount:
        type: integer
      currentStartedSandboxes:
        type: integer
    type: object
  RunnerServiceInfo:
    properties:
      errorReason:
        type: string
      healthy:
        type: boolean
      serviceName:
        type: string
    required:
      - healthy
      - serviceName
    type: object
  SandboxInfoResponse:
    properties:
      backupError:
        type: string
      backupSnapshot:
        type: string
      backupState:
        $ref: '#/definitions/enums.BackupState'
      daemonVersion:
        type: string
      recoverable:
        type: boolean
      state:
        $ref: '#/definitions/enums.SandboxState'
    type: object
  SnapshotDigestResponse:
    properties:
      hash:
        example: a7be6198544f09a75b26e6376459b47c5b9972e7351d440e092c4faa9ea064ff
        type: string
      sizeGB:
        example: 0.13
        type: number
    type: object
  SnapshotExistsResponse:
    properties:
      exists:
        example: true
        type: boolean
    type: object
  SnapshotInfoResponse:
    properties:
      cmd:
        example:
          - '["nginx"'
          - '"-g"'
          - '"daemon off;"]'
        items:
          type: string
        type: array
      entrypoint:
        example:
          - '["nginx"'
          - '"-g"'
          - '"daemon off;"]'
        items:
          type: string
        type: array
      hash:
        example: a7be6198544f09a75b26e6376459b47c5b9972e7351d440e092c4faa9ea064ff
        type: string
      name:
        example: nginx:latest
        type: string
      sizeGB:
        example: 0.13
        type: number
    type: object
  StartSandboxResponse:
    properties:
      daemonVersion:
        type: string
    type: object
  StopSandboxDTO:
    properties:
      force:
        type: boolean
    type: object
  TagImageRequestDTO:
    properties:
      sourceImage:
        type: string
      targetImage:
        type: string
    required:
      - sourceImage
      - targetImage
    type: object
  UpdateNetworkSettingsDTO:
    properties:
      domainAllowList:
        type: string
      networkAllowList:
        type: string
      networkBlockAll:
        type: boolean
      networkLimitEgress:
        type: boolean
    type: object
  UpdateSandboxSecretsDTO:
    properties:
      env:
        additionalProperties:
          type: string
        description: |-
          Env is the sandbox's full desired secret env: env var names mapped to
          secret placeholder values. Replace semantics — placeholder-valued env
          vars not present in the map are unset for newly spawned processes.
        type: object
    type: object
  dto.VolumeDTO:
    properties:
      mountPath:
        type: string
      subpath:
        type: string
      volumeId:
        type: string
    type: object
  enums.BackupState:
    enum:
      - NONE
      - PENDING
      - IN_PROGRESS
      - COMPLETED
      - FAILED
    type: string
    x-enum-varnames:
      - BackupStateNone
      - BackupStatePending
      - BackupStateInProgress
      - BackupStateCompleted
      - BackupStateFailed
  enums.SandboxState:
    enum:
      - creating
      - restoring
      - destroyed
      - destroying
      - started
      - stopped
      - starting
      - stopping
      - resizing
      - error
      - unknown
      - pulling_snapshot
    type: string
    x-enum-varnames:
      - SandboxStateCreating
      - SandboxStateRestoring
      - SandboxStateDestroyed
      - SandboxStateDestroying
      - SandboxStateStarted
      - SandboxStateStopped
      - SandboxStateStarting
      - SandboxStateStopping
      - SandboxStateResizing
      - SandboxStateError
      - SandboxStateUnknown
      - SandboxStatePullingSnapshot
  generationstop.ExpectedGeneration:
    properties:
      containerCreatedAt:
        type: string
      containerId:
        type: string
      executionStartedAt:
        type: string
      restartCount:
        type: integer
    required:
      - containerCreatedAt
      - containerId
      - executionStartedAt
      - restartCount
    type: object
  generationstop.Fence:
    properties:
      workspaceExecutionManifestRef:
        type: string
    required:
      - workspaceExecutionManifestRef
    type: object
  generationstop.GenerationObservation:
    properties:
      fence:
        $ref: '#/definitions/generationstop.Fence'
      generation:
        $ref: '#/definitions/generationstop.ExpectedGeneration'
      observedAt:
        type: string
      owner:
        $ref: '#/definitions/generationstop.Owner'
      source:
        $ref: '#/definitions/generationstop.Source'
      state:
        type: string
    required:
      - fence
      - generation
      - observedAt
      - owner
      - source
      - state
    type: object
  generationstop.GenerationObservationRequest:
    properties:
      fence:
        $ref: '#/definitions/generationstop.Fence'
      owner:
        $ref: '#/definitions/generationstop.Owner'
      source:
        $ref: '#/definitions/generationstop.Source'
    required:
      - fence
      - owner
      - source
    type: object
  generationstop.Observation:
    properties:
      receipt:
        $ref: '#/definitions/generationstop.Receipt'
      request:
        $ref: '#/definitions/generationstop.StopRequest'
      status:
        type: string
    required:
      - status
    type: object
  generationstop.Owner:
    properties:
      grantId:
        type: string
      runId:
        type: string
      tenantId:
        type: string
      userId:
        type: string
      workingCopyId:
        type: string
      workspaceId:
        type: string
    required:
      - grantId
      - runId
      - tenantId
      - userId
      - workingCopyId
      - workspaceId
    type: object
  generationstop.Purpose:
    properties:
      kind:
        type: string
      nonce:
        type: string
      rendererProcessIdentity:
        $ref: '#/definitions/generationstop.RendererProcessIdentity'
      sessionId:
        type: string
    required:
      - kind
    type: object
  generationstop.Receipt:
    properties:
      kind:
        type: string
      receiptDigest:
        type: string
      receiptRef:
        type: string
      request:
        $ref: '#/definitions/generationstop.StopRequest'
      stoppedAt:
        type: string
      terminalGeneration:
        $ref: '#/definitions/generationstop.TerminalGeneration'
      version:
        type: integer
    required:
      - kind
      - receiptDigest
      - receiptRef
      - request
      - stoppedAt
      - terminalGeneration
      - version
    type: object
  generationstop.RendererProcessIdentity:
    properties:
      pid:
        type: integer
      startTicks:
        type: string
    required:
      - pid
      - startTicks
    type: object
  generationstop.Source:
    properties:
      expectedProfile:
        type: string
      expectedRuntimeKind:
        type: string
      providerResourceId:
        type: string
    required:
      - expectedProfile
      - expectedRuntimeKind
      - providerResourceId
    type: object
  generationstop.StopAuthority:
    properties:
      fence:
        $ref: '#/definitions/generationstop.Fence'
      operationId:
        type: string
      receiptDigest:
        type: string
      receiptRef:
        type: string
      terminalGeneration:
        $ref: '#/definitions/generationstop.TerminalGeneration'
    required:
      - fence
      - operationId
      - receiptDigest
      - receiptRef
      - terminalGeneration
    type: object
  generationstop.StopRequest:
    properties:
      expectedGeneration:
        $ref: '#/definitions/generationstop.ExpectedGeneration'
      fence:
        $ref: '#/definitions/generationstop.Fence'
      operationId:
        type: string
      owner:
        $ref: '#/definitions/generationstop.Owner'
      purpose:
        $ref: '#/definitions/generationstop.Purpose'
      requestFingerprint:
        type: string
      source:
        $ref: '#/definitions/generationstop.Source'
    required:
      - expectedGeneration
      - fence
      - operationId
      - owner
      - purpose
      - requestFingerprint
      - source
    type: object
  generationstop.TerminalGeneration:
    properties:
      containerCreatedAt:
        type: string
      containerId:
        type: string
      executionFinishedAt:
        type: string
      executionStartedAt:
        type: string
      exitCode:
        type: integer
      oomKilled:
        type: boolean
      restartCount:
        type: integer
    required:
      - containerCreatedAt
      - containerId
      - executionFinishedAt
      - executionStartedAt
      - exitCode
      - oomKilled
      - restartCount
    type: object
  workingcopy.CaptureAuthority:
    properties:
      authorityRef:
        type: string
      helper:
        $ref: '#/definitions/workingcopy.CaptureAuthorityArtifact'
      lineageRef:
        type: string
      protocol:
        $ref: '#/definitions/workingcopy.CaptureAuthorityArtifact'
      roleRef:
        type: string
    required:
      - authorityRef
      - helper
      - lineageRef
      - protocol
      - roleRef
    type: object
  workingcopy.CaptureAuthorityArtifact:
    properties:
      digest:
        type: string
      ref:
        type: string
    required:
      - digest
      - ref
    type: object
  workingcopy.CaptureBinding:
    properties:
      authority:
        $ref: '#/definitions/workingcopy.CaptureAuthority'
      owner:
        $ref: '#/definitions/workingcopy.CaptureOwner'
      providerName:
        type: string
      requestFingerprint:
        type: string
      selector:
        $ref: '#/definitions/workingcopy.CaptureSelector'
      source:
        $ref: '#/definitions/workingcopy.SourceAddress'
      stopAuthority:
        $ref: '#/definitions/generationstop.StopAuthority'
    required:
      - authority
      - owner
      - providerName
      - requestFingerprint
      - selector
      - source
      - stopAuthority
    type: object
  workingcopy.CaptureDeleteReceipt:
    properties:
      authority:
        $ref: '#/definitions/workingcopy.CaptureAuthority'
      outcome:
        type: string
      owner:
        $ref: '#/definitions/workingcopy.CaptureOwner'
      providerName:
        type: string
      providerResourceId:
        type: string
      requestFingerprint:
        type: string
      selector:
        $ref: '#/definitions/workingcopy.CaptureSelector'
      source:
        $ref: '#/definitions/workingcopy.SourceAddress'
      stopAuthority:
        $ref: '#/definitions/generationstop.StopAuthority'
    required:
      - authority
      - outcome
      - owner
      - providerName
      - providerResourceId
      - requestFingerprint
      - selector
      - source
      - stopAuthority
    type: object
  workingcopy.CaptureExistsResponse:
    properties:
      authority:
        $ref: '#/definitions/workingcopy.CaptureAuthority'
      exists:
        type: boolean
      owner:
        $ref: '#/definitions/workingcopy.CaptureOwner'
      providerName:
        type: string
      providerResourceId:
        type: string
      receipt:
        $ref: '#/definitions/workingcopy.CaptureReceipt'
      requestFingerprint:
        type: string
      selector:
        $ref: '#/definitions/workingcopy.CaptureSelector'
      source:
        $ref: '#/definitions/workingcopy.SourceAddress'
      status:
        type: string
      stopAuthority:
        $ref: '#/definitions/generationstop.StopAuthority'
    required:
      - authority
      - owner
      - providerName
      - providerResourceId
      - requestFingerprint
      - selector
      - source
      - status
      - stopAuthority
    type: object
  workingcopy.CaptureIdentity:
    properties:
      authority:
        $ref: '#/definitions/workingcopy.CaptureAuthority'
      owner:
        $ref: '#/definitions/workingcopy.CaptureOwner'
      providerName:
        type: string
      providerResourceId:
        type: string
      requestFingerprint:
        type: string
      selector:
        $ref: '#/definitions/workingcopy.CaptureSelector'
      source:
        $ref: '#/definitions/workingcopy.SourceAddress'
      stopAuthority:
        $ref: '#/definitions/generationstop.StopAuthority'
    required:
      - authority
      - owner
      - providerName
      - providerResourceId
      - requestFingerprint
      - selector
      - source
      - stopAuthority
    type: object
  workingcopy.CaptureObservation:
    properties:
      binding:
        $ref: '#/definitions/workingcopy.CaptureBinding'
      identity:
        $ref: '#/definitions/workingcopy.CaptureIdentity'
      receipt:
        $ref: '#/definitions/workingcopy.CaptureReceipt'
      status:
        type: string
    required:
      - status
    type: object
  workingcopy.CaptureOwner:
    properties:
      grantId:
        type: string
      runId:
        type: string
      tenantId:
        type: string
      userId:
        type: string
      workingCopyId:
        type: string
      workspaceId:
        type: string
    required:
      - grantId
      - runId
      - tenantId
      - userId
      - workingCopyId
      - workspaceId
    type: object
  workingcopy.CaptureReadRequest:
    properties:
      authority:
        $ref: '#/definitions/workingcopy.CaptureAuthority'
      expectedProviderSha256Digest:
        type: string
      expectedTotalByteLength:
        type: integer
      maximumBytes:
        type: integer
      offset:
        type: integer
      owner:
        $ref: '#/definitions/workingcopy.CaptureOwner'
      providerName:
        type: string
      providerResourceId:
        type: string
      requestFingerprint:
        type: string
      selector:
        $ref: '#/definitions/workingcopy.CaptureSelector'
      source:
        $ref: '#/definitions/workingcopy.SourceAddress'
      stopAuthority:
        $ref: '#/definitions/generationstop.StopAuthority'
    required:
      - authority
      - expectedProviderSha256Digest
      - expectedTotalByteLength
      - maximumBytes
      - offset
      - owner
      - providerName
      - providerResourceId
      - requestFingerprint
      - selector
      - source
      - stopAuthority
    type: object
  workingcopy.CaptureReadResponse:
    properties:
      authority:
        $ref: '#/definitions/workingcopy.CaptureAuthority'
      byteLength:
        type: integer
      bytesBase64:
        type: string
      eof:
        type: boolean
      offset:
        type: integer
      owner:
        $ref: '#/definitions/workingcopy.CaptureOwner'
      providerName:
        type: string
      providerResourceId:
        type: string
      providerSha256Digest:
        type: string
      requestFingerprint:
        type: string
      selector:
        $ref: '#/definitions/workingcopy.CaptureSelector'
      source:
        $ref: '#/definitions/workingcopy.SourceAddress'
      stopAuthority:
        $ref: '#/definitions/generationstop.StopAuthority'
      totalByteLength:
        type: integer
    required:
      - authority
      - offset
      - owner
      - providerName
      - providerResourceId
      - providerSha256Digest
      - requestFingerprint
      - selector
      - source
      - stopAuthority
      - totalByteLength
    type: object
  workingcopy.CaptureReceipt:
    properties:
      authority:
        $ref: '#/definitions/workingcopy.CaptureAuthority'
      capturedAt:
        type: string
      owner:
        $ref: '#/definitions/workingcopy.CaptureOwner'
      providerName:
        type: string
      providerResourceId:
        type: string
      providerSha256Digest:
        type: string
      requestFingerprint:
        type: string
      selector:
        $ref: '#/definitions/workingcopy.CaptureSelector'
      source:
        $ref: '#/definitions/workingcopy.SourceAddress'
      stopAuthority:
        $ref: '#/definitions/generationstop.StopAuthority'
      totalByteLength:
        type: integer
    required:
      - authority
      - capturedAt
      - owner
      - providerName
      - providerResourceId
      - providerSha256Digest
      - requestFingerprint
      - selector
      - source
      - stopAuthority
      - totalByteLength
    type: object
  workingcopy.CaptureSelector:
    properties:
      semanticZoneRef:
        type: string
      zoneRelativePath:
        type: string
    required:
      - semanticZoneRef
      - zoneRelativePath
    type: object
  workingcopy.SourceAddress:
    properties:
      expectedProfile:
        type: string
      expectedRuntimeKind:
        type: string
      providerResourceId:
        type: string
    required:
      - expectedProfile
      - expectedRuntimeKind
      - providerResourceId
    type: object
  workingcopy.StoppedDirectoryRosterEntry:
    properties:
      kind:
        type: string
      mode:
        type: string
        x-nullable: true
      name:
        type: string
      sha256:
        type: string
        x-nullable: true
      size:
        type: integer
      zoneRelativePath:
        type: string
    required:
      - kind
      - mode
      - name
      - sha256
      - size
      - zoneRelativePath
    type: object
  workingcopy.StoppedDirectoryRosterReceipt:
    properties:
      entries:
        items:
          $ref: '#/definitions/workingcopy.StoppedDirectoryRosterEntry'
        type: array
      observedAt:
        type: string
      request:
        $ref: '#/definitions/workingcopy.StoppedDirectoryRosterRequest'
      rosterDigest:
        type: string
      terminalGeneration:
        $ref: '#/definitions/generationstop.TerminalGeneration'
    required:
      - entries
      - observedAt
      - request
      - rosterDigest
      - terminalGeneration
    type: object
  workingcopy.StoppedDirectoryRosterRequest:
    properties:
      anchor:
        $ref: '#/definitions/workingcopy.CaptureBinding'
      maximumAggregateBytes:
        type: integer
      maximumDepth:
        type: integer
      maximumEntries:
        type: integer
      maximumFileBytes:
        type: integer
      selector:
        $ref: '#/definitions/workingcopy.CaptureSelector'
    required:
      - anchor
      - maximumAggregateBytes
      - maximumDepth
      - maximumEntries
      - maximumFileBytes
      - selector
    type: object
info:
  contact: {}
  description: Daytona Runner API
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: Daytona Runner API
  version: v0.0.0-dev
paths:
  /:
    get:
      description: Health check
      operationId: HealthCheck
      produces:
        - application/json
      responses:
        '200':
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
  /info:
    get:
      description: Runner info with system metrics
      operationId: RunnerInfo
      produces:
        - application/json
      responses:
        '200':
          description: OK
