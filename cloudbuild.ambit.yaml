timeout: 3600s

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 200
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true

substitutions:
  _REGISTRY: us-east4-docker.pkg.dev/${PROJECT_ID}/ambit
  _SOURCE_URL: https://github.com/yungbote/ambit-daytona
  # Triggered builds bind the human-readable tag and OCI provenance to the
  # exact source commit. Manual submissions must provide the same full SHA as
  # COMMIT_SHA; a build ID is not source identity.
  _SOURCE_REVISION: ${COMMIT_SHA}
  _TAG: ${COMMIT_SHA}

steps:
  - id: validate-source-revision
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    args:
      - -ec
      - |
        [[ "${_SOURCE_REVISION}" =~ ^[0-9a-f]{40}$ ]] || {
          echo '_SOURCE_REVISION must be the full lowercase Git COMMIT_SHA' >&2
          exit 1
        }
        [[ "${_TAG}" == "${_SOURCE_REVISION}" ]] || {
          echo '_TAG must equal _SOURCE_REVISION for production component builds' >&2
          exit 1
        }

  - id: computer-use-image
    name: gcr.io/cloud-builders/docker
    waitFor: [validate-source-revision]
    args:
      - build
      - --tag=computer-use-amd64:${BUILD_ID}
      - --file=hack/computer-use/Dockerfile
      - .

  - id: computer-use-binary
    name: gcr.io/cloud-builders/docker
    waitFor: [computer-use-image]
    entrypoint: bash
    args:
      - -ec
      - |
        mkdir -p /workspace/dist/libs
        docker run --rm \
          --volume=/workspace/dist:/dist \
          computer-use-amd64:${BUILD_ID}

  - id: api
    name: gcr.io/cloud-builders/docker
    waitFor: [validate-source-revision]
    env: [DOCKER_BUILDKIT=1]
    args:
      - build
      - --build-arg=VERSION=${_TAG}
      - --label=org.opencontainers.image.revision=${_SOURCE_REVISION}
      - --label=org.opencontainers.image.source=${_SOURCE_URL}
      - --tag=${_REGISTRY}/daytona-api:${_TAG}
      - --file=apps/api/Dockerfile
      - .

  - id: proxy
    name: gcr.io/cloud-builders/docker
    waitFor: [validate-source-revision]
    env: [DOCKER_BUILDKIT=1]
    args:
      - build
      - --build-arg=VERSION=${_TAG}
      - --label=org.opencontainers.image.revision=${_SOURCE_REVISION}
      - --label=org.opencontainers.image.source=${_SOURCE_URL}
      - --tag=${_REGISTRY}/daytona-proxy:${_TAG}
      - --file=apps/proxy/Dockerfile
      - .

  - id: ssh-gateway
    name: gcr.io/cloud-builders/docker
    waitFor: [validate-source-revision]
    env: [DOCKER_BUILDKIT=1]
    args:
      - build
      - --build-arg=VERSION=${_TAG}
      - --label=org.opencontainers.image.revision=${_SOURCE_REVISION}
      - --label=org.opencontainers.image.source=${_SOURCE_URL}
      - --tag=${_REGISTRY}/daytona-ssh-gateway:${_TAG}
      - --file=apps/ssh-gateway/Dockerfile
      - .

  - id: runner
    name: gcr.io/cloud-builders/docker
    waitFor: [computer-use-binary]
    env: [DOCKER_BUILDKIT=1]
    args:
      - build
      - --build-arg=VERSION=${_TAG}
      - --label=org.opencontainers.image.revision=${_SOURCE_REVISION}
      - --label=org.opencontainers.image.source=${_SOURCE_URL}
      - --tag=${_REGISTRY}/daytona-runner:${_TAG}
      - --file=apps/runner/Dockerfile
      - .

images:
  - ${_REGISTRY}/daytona-api:${_TAG}
  - ${_REGISTRY}/daytona-proxy:${_TAG}
  - ${_REGISTRY}/daytona-runner:${_TAG}
  - ${_REGISTRY}/daytona-ssh-gateway:${_TAG}
