apiVersion: v1
kind: Service
metadata:
  name: daytona-api
  namespace: daytona-system
  labels:
    app.kubernetes.io/name: daytona
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: daytona
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daytona-api
  namespace: daytona-system
  labels:
    app.kubernetes.io/name: daytona
    app.kubernetes.io/component: api
  annotations:
    ambit.sh/source-url: https://github.com/yungbote/ambit-daytona
    # render-production.sh replaces this only after all four immutable
    # component images prove one matching OCI source revision.
    ambit.sh/source-revision: SOURCE_REVISION_REQUIRED
spec:
  # First boot is intentionally serialized because c4 bootstraps its default
  # region/admin/registries/runner in-process. Scale to 2 only after bootstrap
  # has converged; see README.md.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: daytona
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: daytona
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: daytona-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: daytona
                    app.kubernetes.io/component: api
      containers:
        - name: api
          image: daytona-api:build-required
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: HOME
              value: /tmp
          envFrom:
            - configMapRef:
                name: daytona-api-config
            - secretRef:
                name: daytona-database-secrets
            - secretRef:
                name: daytona-api-secrets
          startupProbe:
            httpGet:
              path: /api/health/29875676-8e7b-47c5-a5e8-d47aed8375fa
              port: http
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/health/29875676-8e7b-47c5-a5e8-d47aed8375fa
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
