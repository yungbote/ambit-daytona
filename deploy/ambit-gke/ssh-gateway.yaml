apiVersion: v1
kind: Service
metadata:
  name: daytona-ssh-gateway
  namespace: daytona-system
  labels:
    app.kubernetes.io/name: daytona
    app.kubernetes.io/component: ssh-gateway
  annotations:
    # GKE 1.29+ resolves the regional address resource by name and retains it
    # independently of this Service. SSH is TCP, so it belongs on an L4
    # passthrough load balancer rather than the HTTP Gateway.
    networking.gke.io/load-balancer-ip-addresses: ambit-daytona-ssh
spec:
  type: LoadBalancer
  loadBalancerClass: networking.gke.io/l4-regional-external
  externalTrafficPolicy: Cluster
  ipFamilyPolicy: SingleStack
  ipFamilies: [IPv4]
  selector:
    app.kubernetes.io/name: daytona
    app.kubernetes.io/component: ssh-gateway
  ports:
    - name: ssh
      port: 2222
      targetPort: ssh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daytona-ssh-gateway
  namespace: daytona-system
  labels:
    app.kubernetes.io/name: daytona
    app.kubernetes.io/component: ssh-gateway
  annotations:
    ambit.sh/source-url: https://github.com/yungbote/ambit-daytona
    ambit.sh/source-revision: SOURCE_REVISION_REQUIRED
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: daytona
      app.kubernetes.io/component: ssh-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: daytona
        app.kubernetes.io/component: ssh-gateway
    spec:
      serviceAccountName: daytona-ssh-gateway
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: daytona
                    app.kubernetes.io/component: ssh-gateway
      containers:
        - name: ssh-gateway
          image: daytona-ssh-gateway:build-required
          imagePullPolicy: IfNotPresent
          ports:
            - name: ssh
              containerPort: 2222
          env:
            - name: SSH_GATEWAY_PORT
              value: "2222"
            - name: API_URL
              value: http://daytona-api.daytona-system.svc.cluster.local:3000/api
            - name: RUNNER_SSH_KNOWN_HOSTS_PATH
              value: /etc/daytona/ssh-trust/runner_known_hosts
          envFrom:
            - secretRef:
                name: daytona-ssh-gateway-secrets
          readinessProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: runner-known-hosts
              mountPath: /etc/daytona/ssh-trust
              readOnly: true
      volumes:
        - name: runner-known-hosts
          secret:
            secretName: daytona-runner-known-hosts
            defaultMode: 0444
            items:
              - key: RUNNER_SSH_KNOWN_HOSTS
                path: runner_known_hosts
