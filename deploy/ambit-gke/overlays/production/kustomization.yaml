apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Kustomize rejects an overlay that imports an ancestor Kustomization as a
  # cycle, even when the ancestor does not list the overlay. Keep this list in
  # the same order as the base Kustomization.
  - ../../namespaces.yaml
  - ../../serviceaccounts.yaml
  - ../../configmaps.yaml
  - ../../migration-job.yaml
  - ../../api.yaml
  - ../../proxy.yaml
  - ../../runner.yaml
  - ../../ssh-gateway.yaml
  - ../../availability.yaml
  - ../../network-policies.yaml
  - state-namespace.yaml
  - state-serviceaccounts.yaml
  - secret-sync-system.yaml
  - secret-sync-runners.yaml
  - secret-sync-state.yaml
  - storage-class.yaml
  - minio.yaml
  - state-network-policies.yaml
  - gateway.yaml
  - gateway-backend-policies.yaml

patches:
  - path: configmaps-patch.yaml
  - path: workload-identity-patches.yaml
  - path: api-runtime-patch.yaml
  - path: migration-runtime-patch.yaml
  - path: proxy-runtime-patch.yaml
  - path: runner-storage-patch.yaml

images:
  - name: daytona-api
    newName: us-east4-docker.pkg.dev/mwcc-infrastructure/ambit/daytona-oss-api
    digest: sha256:82ff866720392758b3e6a882411028963f79001591b3448c6e45f1b5032227b0
  - name: daytona-proxy
    newName: us-east4-docker.pkg.dev/mwcc-infrastructure/ambit/daytona-oss-proxy
    digest: sha256:e7de8d055aa75c87b8148e564734edd53b26e5fbbb2d9c5170d8fa24cc371ab8
  - name: daytona-runner
    newName: us-east4-docker.pkg.dev/mwcc-infrastructure/ambit/daytona-oss-runner
    digest: sha256:a2724bc13323c74744b35be5e46d14b8a85ed9fc4ff12b2347da5a9c1ab58a1d
  - name: daytona-ssh-gateway
    newName: us-east4-docker.pkg.dev/mwcc-infrastructure/ambit/daytona-oss-ssh-gateway
    digest: sha256:5ca5c65b9ab0416d4f1ec55936c2b1f88ec2a1a70a21e45b055950dfaff786c0
