apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Kustomize rejects an overlay that imports an ancestor Kustomization as a
  # cycle, even when the ancestor does not list the overlay. Keep this list in
  # the same order as the base Kustomization.
  - ../../namespaces.yaml
  - ../../serviceaccounts.yaml
  - ../../configmaps.yaml
  - ../../migration-job.yaml
  - ../../api.yaml
  - ../../proxy.yaml
  - ../../runner.yaml
  - ../../ssh-gateway.yaml
  - ../../availability.yaml
  - ../../network-policies.yaml
  - state-namespace.yaml
  - state-serviceaccounts.yaml
  - secret-sync-system.yaml
  - secret-sync-runners.yaml
  - secret-sync-state.yaml
  - storage-class.yaml
  - minio.yaml
  - state-network-policies.yaml
  - redis.yaml
  - gateway.yaml
  - gateway-backend-policies.yaml

patches:
  - path: configmaps-patch.yaml
  - path: workload-identity-patches.yaml
  - path: api-runtime-patch.yaml
  - path: migration-runtime-patch.yaml
  - path: proxy-runtime-patch.yaml
  - path: runner-storage-patch.yaml

images:
  - name: daytona-api
    newName: us-east4-docker.pkg.dev/mwcc-infrastructure/ambit/daytona-api
    digest: sha256:dc09bc909df6ace3da7f0714ccfe0c5229665f1ab71f2fbbc37d00780e0da44a
  - name: daytona-proxy
    newName: us-east4-docker.pkg.dev/mwcc-infrastructure/ambit/daytona-proxy
    digest: sha256:33fd8fb149b987cb7b3710087551cab0720e33d4498dd60d6edd800f7eb11cda
  - name: daytona-runner
    newName: us-east4-docker.pkg.dev/mwcc-infrastructure/ambit/daytona-runner
    digest: sha256:dd71960cd768b59c10cf04d859162d61348dd347b33d114e8df0e0e3ae23fb7b
  - name: daytona-ssh-gateway
    newName: us-east4-docker.pkg.dev/mwcc-infrastructure/ambit/daytona-ssh-gateway
    digest: sha256:c0268c2053297fe9d4e34d9a175d35824d95684aee51a5c31f138d996a4f15c7
