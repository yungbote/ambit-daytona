apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: daytona-api-secret-material
  namespace: daytona-system
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-db-password/versions/latest"
        path: "db-password"
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-redis-auth/versions/latest"
        path: "redis-password"
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-redis-ca/versions/latest"
        path: "redis-ca"
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-encryption-key/versions/latest"
        path: "encryption-key"
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-encryption-salt/versions/latest"
        path: "encryption-salt"
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-proxy-api-key/versions/latest"
        path: "proxy-api-key"
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-runner-api-key/versions/latest"
        path: "runner-api-key"
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-admin-api-key/versions/latest"
        path: "admin-api-key"
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-ssh-api-key/versions/latest"
        path: "ssh-api-key"
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-ssh-public-key/versions/latest"
        path: "ssh-public-key"
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-registry-admin/versions/latest"
        path: "registry-admin"
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-registry-password/versions/latest"
        path: "registry-password"
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-minio-access-key/versions/latest"
        path: "minio-access-key"
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-minio-secret-key/versions/latest"
        path: "minio-secret-key"
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: daytona-database-secrets
  namespace: daytona-system
spec:
  serviceAccountName: daytona-api
  secretProviderClassName: daytona-api-secret-material
  secretObject:
    type: Opaque
    data:
      - sourcePath: "db-password"
        targetKey: DB_PASSWORD
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: daytona-api-secrets
  namespace: daytona-system
spec:
  serviceAccountName: daytona-api
  secretProviderClassName: daytona-api-secret-material
  secretObject:
    type: Opaque
    data:
      - sourcePath: "redis-password"
        targetKey: REDIS_PASSWORD
      - sourcePath: "encryption-key"
        targetKey: ENCRYPTION_KEY
      - sourcePath: "encryption-salt"
        targetKey: ENCRYPTION_SALT
      - sourcePath: "proxy-api-key"
        targetKey: PROXY_API_KEY
      - sourcePath: "runner-api-key"
        targetKey: DEFAULT_RUNNER_API_KEY
      - sourcePath: "admin-api-key"
        targetKey: ADMIN_API_KEY
      - sourcePath: "ssh-api-key"
        targetKey: SSH_GATEWAY_API_KEY
      - sourcePath: "ssh-public-key"
        targetKey: SSH_GATEWAY_PUBLIC_KEY
      - sourcePath: "registry-admin"
        targetKey: TRANSIENT_REGISTRY_ADMIN
      - sourcePath: "registry-password"
        targetKey: TRANSIENT_REGISTRY_PASSWORD
      - sourcePath: "registry-admin"
        targetKey: INTERNAL_REGISTRY_ADMIN
      - sourcePath: "registry-password"
        targetKey: INTERNAL_REGISTRY_PASSWORD
      - sourcePath: "minio-access-key"
        targetKey: S3_ACCESS_KEY
      - sourcePath: "minio-secret-key"
        targetKey: S3_SECRET_KEY
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: daytona-redis-ca
  namespace: daytona-system
spec:
  serviceAccountName: daytona-api
  secretProviderClassName: daytona-api-secret-material
  secretObject:
    type: Opaque
    data:
      - sourcePath: "redis-ca"
        targetKey: CA_CERT
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: daytona-proxy-secret-material
  namespace: daytona-system
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-proxy-api-key/versions/latest"
        path: "proxy-api-key"
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-redis-auth/versions/latest"
        path: "redis-password"
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: daytona-proxy-secrets
  namespace: daytona-system
spec:
  serviceAccountName: daytona-proxy
  secretProviderClassName: daytona-proxy-secret-material
  secretObject:
    type: Opaque
    data:
      - sourcePath: "proxy-api-key"
        targetKey: PROXY_API_KEY
      - sourcePath: "redis-password"
        targetKey: REDIS_PASSWORD
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: daytona-ssh-gateway-secret-material
  namespace: daytona-system
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-ssh-api-key/versions/latest"
        path: "ssh-api-key"
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-ssh-private-key/versions/latest"
        path: "ssh-private-key"
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-ssh-host-key/versions/latest"
        path: "ssh-host-key"
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-runner-known-hosts/versions/latest"
        path: "runner-known-hosts"
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: daytona-ssh-gateway-secrets
  namespace: daytona-system
spec:
  serviceAccountName: daytona-ssh-gateway
  secretProviderClassName: daytona-ssh-gateway-secret-material
  secretObject:
    type: Opaque
    data:
      - sourcePath: "ssh-api-key"
        targetKey: API_KEY
      - sourcePath: "ssh-private-key"
        targetKey: SSH_PRIVATE_KEY
      - sourcePath: "ssh-host-key"
        targetKey: SSH_HOST_KEY
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: daytona-runner-known-hosts
  namespace: daytona-system
spec:
  serviceAccountName: daytona-ssh-gateway
  secretProviderClassName: daytona-ssh-gateway-secret-material
  secretObject:
    type: Opaque
    data:
      - sourcePath: "runner-known-hosts"
        targetKey: RUNNER_SSH_KNOWN_HOSTS

