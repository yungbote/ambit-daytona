apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: daytona-minio-secret-material
  namespace: daytona-state
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-minio-access-key/versions/latest"
        path: "minio-access-key"
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-minio-secret-key/versions/latest"
        path: "minio-secret-key"
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: daytona-minio-root
  namespace: daytona-state
spec:
  serviceAccountName: daytona-minio
  secretProviderClassName: daytona-minio-secret-material
  secretObject:
    type: Opaque
    data:
      - sourcePath: "minio-access-key"
        targetKey: MINIO_ROOT_USER
      - sourcePath: "minio-secret-key"
        targetKey: MINIO_ROOT_PASSWORD
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: daytona-harbor-secret-material
  namespace: daytona-state
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-registry-password/versions/latest"
        path: "registry-password"
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-harbor-shared-secret/versions/latest"
        path: "harbor-shared-secret"
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-harbor-xsrf-key/versions/latest"
        path: "harbor-xsrf-key"
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-harbor-token-key/versions/latest"
        path: "harbor-token-key"
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-harbor-token-cert/versions/latest"
        path: "harbor-token-cert"
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-harbor-registry-htpasswd/versions/latest"
        path: "harbor-registry-htpasswd"
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-harbor-db-password/versions/latest"
        path: "harbor-db-password"
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-harbor-redis-auth/versions/latest"
        path: "redis-password"
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: daytona-harbor-admin
  namespace: daytona-state
spec:
  serviceAccountName: daytona-harbor-secrets
  secretProviderClassName: daytona-harbor-secret-material
  secretObject:
    type: Opaque
    data:
      - sourcePath: "registry-password"
        targetKey: HARBOR_ADMIN_PASSWORD
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: daytona-harbor-shared
  namespace: daytona-state
spec:
  serviceAccountName: daytona-harbor-secrets
  secretProviderClassName: daytona-harbor-secret-material
  secretObject:
    type: Opaque
    data:
      - sourcePath: "harbor-shared-secret"
        targetKey: secretKey
      - sourcePath: "harbor-shared-secret"
        targetKey: secret
      - sourcePath: "harbor-shared-secret"
        targetKey: JOBSERVICE_SECRET
      - sourcePath: "harbor-shared-secret"
        targetKey: REGISTRY_HTTP_SECRET
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: daytona-harbor-xsrf
  namespace: daytona-state
spec:
  serviceAccountName: daytona-harbor-secrets
  secretProviderClassName: daytona-harbor-secret-material
  secretObject:
    type: Opaque
    data:
      - sourcePath: "harbor-xsrf-key"
        targetKey: CSRF_KEY
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: daytona-harbor-token
  namespace: daytona-state
spec:
  serviceAccountName: daytona-harbor-secrets
  secretProviderClassName: daytona-harbor-secret-material
  secretObject:
    type: kubernetes.io/tls
    data:
      - sourcePath: "harbor-token-key"
        targetKey: tls.key
      - sourcePath: "harbor-token-cert"
        targetKey: tls.crt
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: daytona-harbor-registry-credentials
  namespace: daytona-state
spec:
  serviceAccountName: daytona-harbor-secrets
  secretProviderClassName: daytona-harbor-secret-material
  secretObject:
    type: Opaque
    data:
      - sourcePath: "registry-password"
        targetKey: REGISTRY_PASSWD
      - sourcePath: "harbor-registry-htpasswd"
        targetKey: REGISTRY_HTPASSWD
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: daytona-harbor-db
  namespace: daytona-state
spec:
  serviceAccountName: daytona-harbor-secrets
  secretProviderClassName: daytona-harbor-secret-material
  secretObject:
    type: Opaque
    data:
      - sourcePath: "harbor-db-password"
        targetKey: password
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: daytona-harbor-redis
  namespace: daytona-state
spec:
  serviceAccountName: daytona-harbor-secrets
  secretProviderClassName: daytona-harbor-secret-material
  secretObject:
    type: Opaque
    data:
      - sourcePath: "redis-password"
        targetKey: REDIS_PASSWORD
