apiVersion: batch/v1
kind: Job
metadata:
  name: daytona-harbor-bootstrap
  namespace: daytona-state
  labels:
    app: harbor
    app.kubernetes.io/name: harbor
    app.kubernetes.io/component: bootstrap
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 1200
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: harbor
        app.kubernetes.io/name: harbor
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: OnFailure
      serviceAccountName: daytona-harbor
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              attempt=0
              until curl -fsS http://daytona-harbor/api/v2.0/ping >/dev/null; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 180 ]; then
                  echo "Harbor did not become ready before the bootstrap deadline" >&2
                  exit 1
                fi
                sleep 5
              done

              attempt=0
              until curl -fsS \
                -u "harbor_registry_user:${HARBOR_REGISTRY_PASSWORD}" \
                http://daytona-harbor-registry:5000/v2/ >/dev/null; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 60 ]; then
                  echo "Harbor core-to-registry credentials did not authenticate before the bootstrap deadline" >&2
                  exit 1
                fi
                sleep 2
              done

              projects="$(curl -fsS -u "admin:${HARBOR_ADMIN_PASSWORD}" 'http://daytona-harbor/api/v2.0/projects?name=daytona')"
              if printf '%s' "$projects" | grep -Eq '"name"[[:space:]]*:[[:space:]]*"daytona"'; then
                exit 0
              fi

              status="$(curl -sS -o /dev/null -w '%{http_code}' \
                -u "admin:${HARBOR_ADMIN_PASSWORD}" \
                -H 'Content-Type: application/json' \
                -X POST http://daytona-harbor/api/v2.0/projects \
                --data '{"project_name":"daytona","public":false,"metadata":{"auto_scan":"false","prevent_vul":"false","reuse_sys_cve_allowlist":"true"}}')"
              case "$status" in
                201|409) ;;
                *) echo "Harbor project creation failed with HTTP $status" >&2; exit 1 ;;
              esac
          env:
            - name: HARBOR_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: daytona-harbor-admin
                  key: HARBOR_ADMIN_PASSWORD
            - name: HARBOR_REGISTRY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: daytona-harbor-registry-credentials
                  key: REGISTRY_PASSWD
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
