apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: daytona-runner-secret-material
  namespace: daytona-runners
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-runner-api-key/versions/latest"
        path: "runner-api-key"
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-minio-access-key/versions/latest"
        path: "minio-access-key"
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-minio-secret-key/versions/latest"
        path: "minio-secret-key"
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-ssh-public-key/versions/latest"
        path: "ssh-public-key"
      - resourceName: "projects/mwcc-infrastructure/secrets/ambit-daytona-runner-ssh-host-key/versions/latest"
        path: "runner-ssh-host-key"
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: daytona-runner-secrets
  namespace: daytona-runners
spec:
  serviceAccountName: daytona-runner
  secretProviderClassName: daytona-runner-secret-material
  secretObject:
    type: Opaque
    data:
      - sourcePath: "runner-api-key"
        targetKey: DAYTONA_RUNNER_TOKEN
      - sourcePath: "minio-access-key"
        targetKey: AWS_ACCESS_KEY_ID
      - sourcePath: "minio-secret-key"
        targetKey: AWS_SECRET_ACCESS_KEY
      - sourcePath: "ssh-public-key"
        targetKey: SSH_PUBLIC_KEY
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: daytona-runner-host-key
  namespace: daytona-runners
spec:
  serviceAccountName: daytona-runner
  secretProviderClassName: daytona-runner-secret-material
  secretObject:
    type: Opaque
    data:
      - sourcePath: "runner-ssh-host-key"
        targetKey: RUNNER_SSH_HOST_PRIVATE_KEY

