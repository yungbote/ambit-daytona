apiVersion: v1
kind: ConfigMap
metadata:
  name: daytona-api-config
  namespace: daytona-system
data:
  # Cloud SQL Auth Proxy terminates the encrypted connector tunnel inside the
  # pod. Plain TCP exists only on this loopback listener.
  DB_HOST: 127.0.0.1
  DB_PORT: "5432"
  DB_TLS_ENABLED: "false"
  DB_TLS_REJECT_UNAUTHORIZED: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_TLS: "false"
  # Ambit is the user/tenant authority and calls Daytona with its scoped API
  # key. Google OIDC remains a replaceable JWT verification boundary for the
  # upstream control plane; signed previews do not expose this client flow.
  OIDC_CLIENT_ID: 411589140767-ct4tknprtvsg8v2ltkio27e3sf98mb1g.apps.googleusercontent.com
  OIDC_ISSUER_BASE_URL: https://accounts.google.com
  PUBLIC_OIDC_DOMAIN: https://accounts.google.com
  OIDC_AUDIENCE: 411589140767-ct4tknprtvsg8v2ltkio27e3sf98mb1g.apps.googleusercontent.com
  # The public TypeScript SDK waits on this Socket.IO endpoint for sandbox
  # lifecycle events. Every API replica shares the Redis adapter, so the
  # gateway remains horizontally safe behind the GKE Gateway.
  NOTIFICATION_GATEWAY_DISABLED: "false"
  DEFAULT_SNAPSHOT: registry.daytona.ambit.sh/daytona/ambit-agent-workspace@sha256:cbf0fa07de030d3117816b98bf77fa27e122adc97058fdd63b3f6212766edd57
  TRANSIENT_REGISTRY_URL: https://registry.daytona.ambit.sh
  TRANSIENT_REGISTRY_PROJECT_ID: daytona
  INTERNAL_REGISTRY_URL: https://registry.daytona.ambit.sh
  INTERNAL_REGISTRY_PROJECT_ID: daytona
  # The hostname intentionally contains "minio": this AGPL Daytona revision
  # selects its MinIO STS flow from that endpoint and requests prefix-scoped
  # temporary credentials for each organization.
  S3_ENDPOINT: http://minio.daytona-state.svc.cluster.local:9000
  S3_STS_ENDPOINT: http://minio.daytona-state.svc.cluster.local:9000/minio/v1/assume-role
  S3_REGION: us-east4
  S3_DEFAULT_BUCKET: ambit-daytona
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: daytona-proxy-config
  namespace: daytona-system
data:
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_TLS: "false"
  OIDC_CLIENT_ID: 411589140767-ct4tknprtvsg8v2ltkio27e3sf98mb1g.apps.googleusercontent.com
  OIDC_DOMAIN: https://accounts.google.com
  OIDC_PUBLIC_DOMAIN: https://accounts.google.com
  OIDC_AUDIENCE: 411589140767-ct4tknprtvsg8v2ltkio27e3sf98mb1g.apps.googleusercontent.com
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: daytona-runner-config
  namespace: daytona-runners
data:
  AWS_ENDPOINT_URL: http://minio.daytona-state.svc.cluster.local:9000
  AWS_REGION: us-east4
  AWS_DEFAULT_BUCKET: ambit-daytona
