# Daytona and Harbor use separate authenticated Redis instances so their
# database indexes, persistence, credentials, and lifecycle remain owned by
# the consumer they serve. Both instances are intentionally single-replica:
# Redis replication/failover is not claimed by this package.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: daytona-system
  labels:
    app.kubernetes.io/name: daytona
    app.kubernetes.io/component: cache
spec:
  selector:
    app.kubernetes.io/name: daytona
    app.kubernetes.io/component: cache
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: daytona-system
  labels:
    app.kubernetes.io/name: daytona
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: daytona
      app.kubernetes.io/component: cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: daytona
        app.kubernetes.io/component: cache
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          # Redis 7.4.11 Alpine; the digest, not a mutable tag, is pull authority.
          image: docker.io/library/redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
          imagePullPolicy: IfNotPresent
          command: [redis-server]
          args: [--appendonly, "yes", --requirepass, $(REDIS_PASSWORD)]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: daytona-api-secrets
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          startupProbe: &redis-probe
            exec:
              command:
                - sh
                - -ec
                - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -qx PONG
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 2
          readinessProbe:
            <<: *redis-probe
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            <<: *redis-probe
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: daytona-system
  labels:
    app.kubernetes.io/name: daytona
    app.kubernetes.io/component: cache
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: daytona-standard-rwo
  resources:
    requests:
      storage: 10Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-from-control-plane
  namespace: daytona-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: daytona
      app.kubernetes.io/component: cache
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [api, proxy]
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: harbor-redis
  namespace: daytona-state
  labels:
    app.kubernetes.io/name: daytona
    app.kubernetes.io/component: harbor-cache
spec:
  selector:
    app.kubernetes.io/name: daytona
    app.kubernetes.io/component: harbor-cache
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
