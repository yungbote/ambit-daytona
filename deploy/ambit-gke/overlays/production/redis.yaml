  name: harbor-redis
  namespace: daytona-state
  labels:
    app.kubernetes.io/name: daytona
    app.kubernetes.io/component: harbor-cache
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: daytona
      app.kubernetes.io/component: harbor-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: daytona
        app.kubernetes.io/component: harbor-cache
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          # Redis 7.4.11 Alpine; the digest, not a mutable tag, is pull authority.
          image: docker.io/library/redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
          imagePullPolicy: IfNotPresent
          command: [redis-server]
          args: [--appendonly, "yes", --requirepass, $(REDIS_PASSWORD)]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: daytona-harbor-redis
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          startupProbe: &harbor-redis-probe
            exec:
              command:
                - sh
                - -ec
                - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -qx PONG
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 2
          readinessProbe:
            <<: *harbor-redis-probe
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            <<: *harbor-redis-probe
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: harbor-redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: harbor-redis-data
  namespace: daytona-state
  labels:
    app.kubernetes.io/name: daytona
    app.kubernetes.io/component: harbor-cache
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: daytona-standard-rwo
  resources:
    requests:
      storage: 10Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: harbor-redis-from-harbor
  namespace: daytona-state
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: daytona
      app.kubernetes.io/component: harbor-cache
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: harbor
            matchExpressions:
              - key: component
                operator: In
                values: [core, exporter, jobservice, registry]
      ports:
        - protocol: TCP
          port: 6379
