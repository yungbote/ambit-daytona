apiVersion: batch/v1
kind: Job
metadata:
  name: daytona-migrate
  namespace: daytona-system
  labels:
    app.kubernetes.io/name: daytona
    app.kubernetes.io/component: migration
  annotations:
    ambit.sh/source-revision: 9cfc0e9a2987b55489052e8b0479f6b33ed83d5a
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: daytona
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      serviceAccountName: daytona-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: daytona-api:build-required
          imagePullPolicy: IfNotPresent
          command: ["yarn", "migration:run:init"]
          env:
            - name: HOME
              value: /tmp
            - name: npm_config_cache
              value: /tmp/npm-cache
          envFrom:
            - configMapRef:
                name: daytona-api-config
            - secretRef:
                name: daytona-database-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
